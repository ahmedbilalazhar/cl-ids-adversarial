name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src scripts tests
      # Phase 3 has a separate Python 3.12.14/hash-locked qualification workflow.
      - run: python -m pytest tests/ -q --ignore-glob='tests/test_phase3*.py' --ignore=tests/test_continuation.py --ignore=tests/test_delivery_catalog.py --ignore=tests/test_catalog_snapshot.py --ignore=tests/test_delivery_reliability.py --ignore=tests/test_archive_policy.py --ignore=tests/test_audit_integrity.py --ignore=tests/test_evaluation_reuse.py --ignore=tests/test_notebook_orchestration.py --ignore=tests/test_notebook_session.py --ignore=tests/test_reported_metrics.py --ignore=tests/test_research_endpoints.py --ignore=tests/test_transport_integrity.py --ignore=tests/test_verified_worker_import.py --ignore=tests/test_worker_bindings.py
      - run: python -m ruff check src scripts tests --select E7,E9,F63,F7,F82
      - run: python scripts/smoke_test.py
