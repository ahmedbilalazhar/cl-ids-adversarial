name: Phase 3 pinned CPU qualification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Create isolated hash-locked CPU environment
        run: |
          python -m pip install uv==0.12.18 ruff==0.16.9
          python -m venv .ci-phase3
          uv pip sync --python .ci-phase3/bin/python --require-hashes --only-binary :all: kaggle_worker/locks/cpu.txt
      - name: Static checks
        run: |
          .ci-phase3/bin/python -m compileall -q kaggle_worker phase3_delivery tests/test_continuation.py
          ruff check kaggle_worker phase3_delivery tests/test_continuation.py --select E9,F63,F7,F82,F401
      - name: Data-independent reference and analysis tests
        run: .ci-phase3/bin/python -m unittest tests.test_phase3_v2 tests.test_phase3_analysis tests.test_continuation
      - name: Contract and numerical qualification
        run: |
          .ci-phase3/bin/python -m kaggle_worker.architecture_checks --output results/ci-kaggle/architecture.json
          .ci-phase3/bin/python -m kaggle_worker.checks --device cpu --output results/ci-kaggle/numerical.json
          .ci-phase3/bin/python -m kaggle_worker.review_checks --output results/ci-kaggle/recovery-performance.json
      - name: Retain machine-readable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3-cpu-qualification
          path: results/ci-kaggle/*.json
          if-no-files-found: warn
          retention-days: 14
