[project]
name = "cl-ids-adversarial"
version = "0.1.0"
description = "Adversarial evaluation of the novelty-discovery stage in continual-learning intrusion detection (CIC-IDS-2017)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Saneedullah" },
  { name = "Ahmed Bilal" },
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
